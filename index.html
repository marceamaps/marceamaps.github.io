<!-- Motto Text Animates Here-->

<script>
  const mottos = [
    "make every idea your very best, even if it's your absolute worst.",
    "have strong opinions. hold them loosely.",
    "follow the work. take every opportunity. be grateful.",
    "how you do anything is how you do everything.",
    "pressure is a privilege.",
    "leave everything better than you found it.",
    "I'm obsessed with the idea that there is always a better way."
  ];

  let index = 0;
  const mottoEl = document.getElementById("motto");

  function rotateMottos() {
    mottoEl.style.opacity = 0;
    setTimeout(() => {
      mottoEl.textContent = mottos[index];
      mottoEl.style.opacity = 1;
      index = (index + 1) % mottos.length;
    }, 400);
  }

  // Initial load
  mottoEl.textContent = mottos[0];
  setInterval(rotateMottos, 3500);
</script>

<!-- Animating Cards in Sticky Case Study Section-->

<script>
  window.addEventListener("scroll", () => {
    const scrollY = window.scrollY;
    const triggerOffset = window.innerHeight;
    
    const alphaContainer = document.getElementById("card-alpha").parentElement;
    const gammaContainer = document.getElementById("card-gamma").parentElement;

    // Calculate progress through the section (0 to 1)
    const progress = Math.min((scrollY - triggerOffset) / window.innerHeight, 1);

    if (scrollY > triggerOffset) {
    // Alpha moves from -40% to stop just before Beta (with proper spacing)
    const alphaFinalPosition = 0; // Position Alpha to the left of Beta
    const alphaPosition = -40 + (progress * (alphaFinalPosition - (-40)));
    alphaContainer.style.left = `${alphaPosition}%`;
      
      // Gamma moves from 107% to start just after Beta (with 24px spacing)  
      // Target: 66.67% + 24px gap ≈ 67%
      const gammaFinalPosition = 68;
      const gammaPosition = 107 - (progress * (107 - gammaFinalPosition));
      gammaContainer.style.left = `${gammaPosition}%`;
      } else {
      // Reset to initial positions
      alphaContainer.style.left = '-40%';
      gammaContainer.style.left = '107%';
    }
  });
</script>
