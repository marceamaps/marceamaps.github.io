<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-[#fffdf6] text-gray-800">
  <!-- Sticky Hero Container -->
  <div class="relative h-screen overflow-hidden">
    <!-- Hero Section -->
    <section class="sticky top-0 h-screen z-0 flex flex-col justify-center items-center">
      <h1 class="text-6xl font-bold text-blue-700 mb-6">designer</h1>
      <p class="text-blue-600 text-lg text-center">Designing for the future of tech, lifestyle and experience.<br>Currently building at Strava.</p>
    </section>

    <!-- Scrollable Case Study Section with Glass Effect -->
    <section class="relative z-10 -mt-screen py-20 px-4 backdrop-blur-md bg-white/30 border-t border-white/40">
      <div class="max-w-6xl mx-auto">
        <h2 class="text-2xl font-bold mb-10 text-blue-900">Selected Case Studies</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <div class="bg-white rounded-lg shadow p-4">
            <img src="images/project-alpha.jpg" alt="Project Alpha" class="w-full h-40 object-cover rounded mb-2">
            <h4 class="text-purple-700 font-semibold text-lg">Project Alpha</h4>
            <p class="text-sm text-gray-600">Short summary or teaser text here.</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4">
            <img src="images/project-beta.jpg" alt="Project Beta" class="w-full h-40 object-cover rounded mb-2">
            <h4 class="text-purple-700 font-semibold text-lg">Project Beta</h4>
            <p class="text-sm text-gray-600">Short summary or teaser text here.</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4">
            <img src="images/project-gamma.jpg" alt="Project Gamma" class="w-full h-40 object-cover rounded mb-2">
            <h4 class="text-purple-700 font-semibold text-lg">Project Gamma</h4>
            <p class="text-sm text-gray-600">Short summary or teaser text here.</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
