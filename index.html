<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcea's Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-100 text-gray-800 overflow-x-hidden">

  <!-- Landing Overlay -->
  <div id="landing" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center space-y-8 text-center">
    <h1 class="text-3xl sm:text-4xl font-bold text-violet-700">Hi, I'm Marcea. Who are you?</h1>
    <div class="flex flex-wrap justify-center gap-4">
      <button onclick="enterSite()" class="bg-lime-100 text-black px-6 py-3 rounded-lg text-lg hover:bg-violet-200">Designer</button>
      <button onclick="enterSite()" class="bg-lime-100 text-black px-6 py-3 rounded-lg text-lg hover:bg-violet-200">Manager</button>
      <button onclick="enterSite()" class="bg-lime-100 text-black px-6 py-3 rounded-lg text-lg hover:bg-violet-200">Recruiter</button>
      <button onclick="enterSite()" class="bg-lime-100 text-black px-6 py-3 rounded-lg text-lg hover:bg-violet-200">Just Browsing</button>
    </div>
  </div>

  <script>
    function enterSite() {
      document.getElementById('landing').style.display = 'none';
    }
  </script>

  <!-- Hero Section -->
  <section class="h-screen sticky top-0 z-0 flex flex-col items-center justify-center text-center bg-cover bg-center" style="background-image: url('images/hero-bg.png')">
    <h1 class="text-6xl font-extrabold text-black mb-6">product designer. human. marcea.</h1>
    <p id="motto" class="mt-4 text-xl sm:text-2xl text-gray-800 font-medium h-[2.75rem] flex items-center justify-center transition-opacity duration-500 ease-in-out">
      <!-- Motto text will appear here -->
    </p>  
</section>

<!-- Sticky Case Study Section -->
<section class="w-full h-[200vh] relative z-10">
  <div class="sticky top-0 h-screen w-full bg-white/70 backdrop-blur-md px-6 py-20 overflow-y-auto">
    <h2 class="text-3xl font-bold text-gray-800 mb-12 text-center">Selected Case Studies</h2>
    <div class="grid md:grid-cols-3 gap-8">
      <div class="bg-white rounded-lg shadow p-4">
        <img src="images/project-alpha.jpg" alt="Project Alpha" class="w-full h-40 object-cover rounded mb-4">
        <h3 class="text-purple-600 font-semibold text-lg">Project Alpha</h3>
        <p class="text-gray-700 text-sm">Short summary or teaser text here.</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <img src="images/project-beta.jpg" alt="Project Beta" class="w-full h-40 object-cover rounded mb-4">
        <h3 class="text-purple-600 font-semibold text-lg">Project Beta</h3>
        <p class="text-gray-700 text-sm">Short summary or teaser text here.</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <img src="images/project-gamma.jpg" alt="Project Gamma" class="w-full h-40 object-cover rounded mb-4">
        <h3 class="text-purple-600 font-semibold text-lg">Project Gamma</h3>
        <p class="text-gray-700 text-sm">Short summary or teaser text here.</p>
      </div>
    </div>
  </div>
</section>

<!-- motto text animates here-->

<script>
  const mottos = [
    "make every idea your very best, even if it's your absolute worst.",
    "have strong opinions. hold them loosely.",
    "follow the work. take every opportunity. be grateful.",
    "how you do anything is how you do everything.",
    "pressure is a priviledge.",
  ];

  let index = 0;
  const mottoEl = document.getElementById("motto");

  function rotateMottos() {
    mottoEl.style.opacity = 0;
    setTimeout(() => {
      mottoEl.textContent = mottos[index];
      mottoEl.style.opacity = 1;
      index = (index + 1) % mottos.length;
    }, 400);
  }

  // Initial load
  mottoEl.textContent = mottos[0];
  setInterval(rotateMottos, 3500);
</script>

</body>
</html>
