<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcea Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-gray-800">
  <!-- Hero Section -->
  <section class="h-screen flex flex-col items-center justify-center bg-[#fffdf7] z-0 sticky top-0">
    <h1 class="text-6xl sm:text-7xl font-extrabold text-blue-700 mb-6">designer</h1>
    <p class="text-center text-blue-600 text-lg sm:text-xl leading-relaxed">
      Designing for the future of tech, lifestyle and experience. <br />
      Currently building at Strava.
    </p>
  </section>

  <!-- Case Study Section -->
  <section class="relative z-10 min-h-screen bg-white/70 backdrop-blur-md py-16">
    <div class="max-w-5xl mx-auto px-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-10">Selected Case Studies</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow p-4">
          <img src="images/project-alpha.jpg" alt="Project Alpha" class="w-full h-40 object-cover rounded mb-2">
          <h3 class="text-purple-700 font-semibold text-lg">Project Alpha</h3>
          <p class="text-sm text-gray-600">Short summary or teaser text here.</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
          <img src="images/project-beta.jpg" alt="Project Beta" class="w-full h-40 object-cover rounded mb-2">
          <h3 class="text-purple-700 font-semibold text-lg">Project Beta</h3>
          <p class="text-sm text-gray-600">Short summary or teaser text here.</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
          <img src="images/project-gamma.jpg" alt="Project Gamma" class="w-full h-40 object-cover rounded mb-2">
          <h3 class="text-purple-700 font-semibold text-lg">Project Gamma</h3>
          <p class="text-sm text-gray-600">Short summary or teaser text here.</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
